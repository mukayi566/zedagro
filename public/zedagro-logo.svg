<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160" width="480" height="160" font-family="'Georgia', serif">
  <defs>
    <!-- Deep green gradient for icon -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1B6B2F"/>
      <stop offset="100%" style="stop-color:#2ECC71"/>
    </linearGradient>
    <!-- Amber accent gradient -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A017"/>
      <stop offset="100%" style="stop-color:#F5C842"/>
    </linearGradient>
    <!-- Drop shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <!-- Glow for icon -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ── ICON MARK ── -->
  <!-- Hexagon background -->
  <polygon
    points="80,18 108,34 108,66 80,82 52,66 52,34"
    fill="url(#leafGrad)"
    filter="url(#shadow)"
  />
  <!-- Inner hex grid lines (tech feel) -->
  <line x1="80" y1="18" x2="80" y2="82" stroke="#ffffff18" stroke-width="1"/>
  <line x1="52" y1="34" x2="108" y2="66" stroke="#ffffff18" stroke-width="1"/>
  <line x1="108" y1="34" x2="52" y2="66" stroke="#ffffff18" stroke-width="1"/>

  <!-- Stylised Z with leaf tail -->
  <!-- Z body -->
  <polyline
    points="62,34 98,34 65,66 98,66"
    fill="none"
    stroke="white"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />
  <!-- Leaf sprout off top-right of Z -->
  <path
    d="M98,34 C104,22 116,26 112,38 C106,30 98,34 98,34Z"
    fill="url(#amberGrad)"
  />
  <!-- Small stem -->
  <line x1="98" y1="34" x2="104" y2="28" stroke="url(#amberGrad)" stroke-width="2" stroke-linecap="round"/>

  <!-- ── WORDMARK ── -->
  <!-- "ZED" -->
  <text
    x="128" y="70"
    font-family="'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif"
    font-weight="700"
    font-size="46"
    letter-spacing="-1"
    fill="#1B6B2F"
  >ZED</text>

  <!-- "AGRO" in amber -->
  <text
    x="238" y="70"
    font-family="'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif"
    font-weight="700"
    font-size="46"
    letter-spacing="-1"
    fill="#C8920A"
  >AGRO</text>

  <!-- Tagline -->
  <text
    x="129" y="92"
    font-family="'Trebuchet MS', 'Lucida Sans Unicode', sans-serif"
    font-size="11.5"
    letter-spacing="3.5"
    fill="#4A7A5A"
    font-weight="400"
  >SMART FARMING · ZAMBIA</text>

  <!-- Thin rule under tagline -->
  <line x1="129" y1="98" x2="412" y2="98" stroke="#2ECC71" stroke-width="1" opacity="0.5"/>
</svg>
